{%extends 'base.html'%}
{%load static%}
{%block title%}
Login
{%endblock%}
{%block stylesheets%}
<link href="{%static 'css/style2.css'%}" rel="stylesheet" type="text/css" />

{%endblock stylesheets%}
{%block content%}
<div style="width: 100vw;height: 100vh;">
    <div id="app" class="position-absolute top-50 start-50 translate-middle">
        <div id="auth-section" class="section">
            <div class="auth-tabs d-flex justify-content-center">
                <button class="btn btn-info" data-tab="login">Login</button>
            </div>
            <form id="auth-form" method="post" action="" class="tab-content active" data-tab="login">
                {%csrf_token%}
                <input type="text" id="username" name="username" placeholder="Username" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</div>
{%endblock%}

{%block javascript%}
{%endblock%}
