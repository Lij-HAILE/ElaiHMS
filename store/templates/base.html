{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="{{request.build_absolute_uri}}{%static 'images/favicon.png'%}">
	<meta property="og:image:type" content="image/png">
	<meta property="og:image:width" content="436">
	<meta property="og:image:height" content="228">
	<meta property="og:description" content="Welcome to Jovial Industries, a leading manufacturer of high-quality marbles and granites. Our journey began with a commitment to excellence and a passion for crafting beautiful, durable surfaces. Over the years, we have honed our skills to become a trusted
                                                name in the industry, known for our attention to detail and dedication to customer satisfaction.">
    <meta itemprop="name" content="Jovial Industries" />
	<meta itemprop="description" content="Welcome to Jovial Industries, a leading manufacturer of high-quality marbles and granites. Our journey began with a commitment to excellence and a passion for crafting beautiful, durable surfaces. Over the years, we have honed our skills to become a trusted
                                        name in the industry, known for our attention to detail and dedication to customer satisfaction." />
	<meta itemprop="image" content="{{request.build_absolute_uri}}{%static 'images/favicon.png'%}" />
    <link href="{%static 'css/bootstrap.css'%}" rel="stylesheet" type="text/css" />
    <link href="{%static 'css/style.css'%}" rel="stylesheet" type="text/css" />
    <link href="{%static 'css/style.scss'%}" rel="stylesheet" type="text/scss" />
    <link href="{%static 'css/font-awesome.min.css'%}" rel="stylesheet" type="text/css" />
    <link href="{%static 'css/responsive.css'%}" rel="stylesheet" type="text/css" />
    <link rel="icon" href="{% static 'images/favicon.png'%}" type="image/gif" />

    <title>{%block title%}{%endblock title%}</title>
    {%block stylesheets%}{%endblock stylesheets%}
</head>
<body>
    {%block content%}
    {%endblock content%}
</body>
{%block javascript%}
{%endblock%}
<script src="{%static 'js/jquery-3.4.1.min.js' %}"></script>
<!-- bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</html>
